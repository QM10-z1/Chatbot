<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DeepSeek Chatbot</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; background: #f0f2f5; }
        #chat-box { background: white; border: 1px solid #ddd; border-radius: 8px; height: 400px; overflow-y: scroll; padding: 1rem; margin-bottom: 1rem; }
        .message { margin-bottom: 0.8rem; line-height: 1.4; }
        .user { color: #1a73e8; font-weight: 600; }
        .assistant { color: #188038; font-weight: 600; }
        .controls { display: flex; gap: 10px; margin-bottom: 1rem; }
        .controls button { padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: white; }
        .controls button:hover { background: #e8f0fe; }
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 0.6rem; border-radius: 4px; border: 1px solid #ccc; outline: none; }
        input[type="text"]:focus { border-color: #1a73e8; }
        .input-area button { padding: 0.6rem 1.2rem; border-radius: 4px; border: none; background: #1a73e8; color: white; cursor: pointer; }
        .input-area button:hover { background: #1557b0; }
    </style>
</head>
<body>
    <h2>DeepSeek 聊天机器人</h2>
    
        <div class="controls">
        <!-- 现有的按钮 -->
        <select id="session-select" onchange="switchSession(this.value)" style="padding: 0.4rem; border-radius: 4px;">
            <option value="">-- 选择历史会话 --</option>
        </select>
        <button onclick="fetchSessions()">刷新列表</button>
        <button onclick="createNewSession()">新建会话</button>
        <button onclick="clearCurrentSession()">清空当前会话</button>
    </div>

    <!-- 【新增这里】历史消息搜索框 -->
    <div class="controls" style="margin-top: 10px;">
        <input type="text" id="search-input" placeholder="输入关键词搜索历史消息..." style="padding: 0.4rem; flex: 1;">
        <button onclick="searchMessages()">搜索</button>
        <button onclick="loadHistory()">重置</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="msg-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        let currentSessionId = "default";

        // 初始化：加载历史列表
        window.onload = () => {
            fetchSessions();
            // 如果没有历史，自动建个新的
            if (!currentSessionId) createNewSession();
        };

        // 1. 获取所有历史会话，填充到下拉框
                // 1. 获取所有历史会话，填充到下拉框
                async function fetchSessions() {
            try {
                // 请求接口
                const res = await fetch('/sessions');
                console.log("接口返回状态码:", res.status); // 方便 F12 控制台排查
                
                if (!res.ok) {
                    console.warn("接口请求失败，但不是致命错误，可能是数据库为空。");
                    return; // 直接返回，不弹窗
                }

                const data = await res.json();
                console.log("拿到的数据:", data); // 看看有没有 sessions 字段

                const select = document.getElementById('session-select');
                if (!select) return;

                // 清空下拉框（保留默认项）
                select.innerHTML = '<option value="">-- 选择历史会话 --</option>';
                
                // 渲染数据
                if (data.sessions && data.sessions.length > 0) {
                    data.sessions.forEach(id => {
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.innerText = id; // 显示原有的 ID
                        if (id === currentSessionId) opt.selected = true;
                        select.appendChild(opt);
                    });
                } else {
                    console.log("数据库里目前没有历史会话");
                }
            } catch (err) {
                // 只有在彻底断网时才提示
                console.error("网络错误:", err);
                alert("无法连接到服务器，请确认 uvicorn 是否已启动！");
            }
        }

        // 2. 切换会话
        async function switchSession(id) {
            if (!id) return;
            currentSessionId = id;
            await loadHistory();
        }

        // 3. 新建会话
                // 3. 新建会话
        async function createNewSession() {
            // 使用 prompt 弹窗让用户输入自定义名称
            let customId = prompt("请输入新会话的名称（例如：张三的聊天室）：");
            
            // 如果用户点了取消或者输入为空，直接终止
            if (!customId || customId.trim() === "") return;
            
            currentSessionId = customId.trim();
            document.getElementById('chat-box').innerHTML = '';
            
            // 提示创建成功，并刷新下拉框
            appendMessage('assistant', '新会话已创建，当前会话名称: ' + currentSessionId);
            await fetchSessions();
        }

        // 4. 清空当前会话
        async function clearCurrentSession() {
            if (!confirm('确定要清空当前会话吗？')) return;
            await fetch(`/sessions/${currentSessionId}`, { method: 'DELETE' });
            document.getElementById('chat-box').innerHTML = '';
            // 清空后，如果列表里还有别的，就自动切过去
            fetchSessions().then(() => {
                const select = document.getElementById('session-select');
                if (select.options.length > 1) {
                    switchSession(select.options[1].value);
                } else {
                    createNewSession();
                }
            });
        }

        // 5. 加载当前会话的历史
                // 5. 加载当前会话的历史
        async function loadHistory() {
            const res = await fetch(`/sessions/${currentSessionId}/messages`);
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            
            if (res.status === 404) return;
            
            const data = await res.json();
            if (data.messages.length === 0) {
                box.innerHTML = '<p>空会话，开始聊天吧。</p>';
            } else {
                data.messages.forEach(m => appendMessage(m.role, m.content));
            }
        }

        // 【新增这里】搜索消息功能
        async function searchMessages() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) {
                loadHistory();
                return;
            }
            
            const res = await fetch(`/sessions/${currentSessionId}/messages?keyword=${encodeURIComponent(keyword)}`);
            if (res.status === 404) {
                alert("会话不存在");
                return;
            }
            
            const data = await res.json();
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            
            if (data.messages.length === 0) {
                box.innerHTML = `<p>没有找到包含 "${keyword}" 的消息。</p>`;
            } else {
                data.messages.forEach(m => appendMessage(m.role, m.content));
            }
        }

        // 6. 渲染单条消息
        function appendMessage(role, content) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = `${role === 'user' ? '你' : 'AI'}: ${content}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 7. 发送消息
                // 7. 发送消息 (流式输出版)
        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const message = input.value.trim();
            if (!message) return;
            input.value = '';
            
            // 渲染用户的提问
            appendMessage('user', message);

            // 预先创建一个 AI 消息的 DOM 元素，用来装流式返回的文字
            const box = document.getElementById('chat-box');
            const aiDiv = document.createElement('div');
            aiDiv.className = `message assistant`;
            aiDiv.innerText = `AI: `;
            box.appendChild(aiDiv);
            box.scrollTop = box.scrollHeight;

            try {
                // 调用流式接口
                const res = await fetch('/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: currentSessionId, message })
                });

                if (!res.ok) {
                    aiDiv.innerText += ` [请求出错: ${res.status}]`;
                    return;
                }

                // 获取读取流的 reader
                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let fullText = "";

                // 循环读取流
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    // 解码并拼接到页面上
                    const chunk = decoder.decode(value, { stream: true });
                    fullText += chunk;
                    aiDiv.innerText = `AI: ` + fullText;
                    
                    // 保持滚动条在最底部
                    box.scrollTop = box.scrollHeight;
                }

                // 流式结束后，刷新一下下拉列表
                fetchSessions();

            } catch (err) {
                aiDiv.innerText += ` [网络错误]`;
            }
        }
    </script>
</body>
</html>
